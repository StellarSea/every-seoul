services:
  web:
    build:
      context: .
    environment:
      API_BASE_URL: ${API_BASE_URL:-/api}
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in your production env file}'
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../every-seoul-backend
    environment:
      APP_NAME: '에브리 서울 API'
      APP_VERSION: '1.0.0'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER:-everyseoul}
      DB_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production env file}'
      DB_NAME: ${POSTGRES_DB:-everyseoul}
      ENVIRONMENT: production
      DEBUG: 'false'
      CREATE_DATABASE: 'false'
      CREATE_DB_TABLES: ${CREATE_DB_TABLES:-true}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      CORS_ORIGINS: '${PUBLIC_WEB_ORIGIN:?Set PUBLIC_WEB_ORIGIN in your production env file}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in your production env file}'
      SEOUL_OPEN_API_KEY: ${SEOUL_OPEN_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-everyseoul}
      POSTGRES_USER: ${POSTGRES_USER:-everyseoul}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production env file}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
